<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1a3a" />
    <title>CanaryQuest — RPG pixel-art de las Islas Canarias</title>
    <meta
      name="description"
      content="Aventura estilo Zelda de SNES por las 8 Islas Canarias: explora Timanfaya, Garajonay o el Roque Nublo, lucha con la espada, resuelve misiones y reúne los símbolos guanches. Gratis y libre, en el navegador y el móvil."
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./logo.png" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="CanaryQuest" />
    <meta property="og:title" content="CanaryQuest — RPG pixel-art de las Islas Canarias" />
    <meta
      property="og:description"
      content="Explora las Islas Canarias al estilo Zelda de SNES: volcanes, laurisilva, dunas y misiones con sabor canario. Juega gratis en el navegador."
    />
    <meta property="og:url" content="https://erseco.github.io/CanaryQuest/" />
    <meta property="og:image" content="https://erseco.github.io/CanaryQuest/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mapa pixel-art de las Islas Canarias con el título CanaryQuest" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CanaryQuest — RPG pixel-art de las Islas Canarias" />
    <meta name="twitter:description" content="Explora las Islas Canarias al estilo Zelda de SNES. Gratis en el navegador." />
    <meta name="twitter:image" content="https://erseco.github.io/CanaryQuest/og-image.jpg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100dvh;
        background: #0a1a3a;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
      }
      /* Pantalla de carga: se ve antes de que llegue el juego, con el estilo de los lugares 3D. */
      #carga {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 16px;
        color: #fff9eb;
        font: 500 15px/1.4 'Avenir Next', 'Trebuchet MS', sans-serif;
        background:
          radial-gradient(ellipse 80% 45% at 50% 62%, #f6c27a55, transparent 70%),
          linear-gradient(180deg, #1d4a57 0%, #c7835f 46%, #f0b874 58%, #2c6c74 60%, #143e44 100%);
        transition: opacity 0.5s;
      }
      #carga.fuera {
        opacity: 0;
        pointer-events: none;
      }
      #carga .centro {
        text-align: center;
        width: min(420px, 100%);
      }
      #carga .rosa {
        display: block;
        font-size: 34px;
        color: #f2c45a;
        animation: girar 6s linear infinite;
      }
      #carga h1 {
        margin: 4px 0 2px;
        font: 600 clamp(42px, 10vw, 72px) / 1 Georgia, 'Times New Roman', serif;
        text-shadow: 0 3px 0 #143e44, 0 10px 30px #0b2a30aa;
      }
      #carga .lema {
        margin: 0 0 28px;
        font: italic 400 18px/1.3 Georgia, serif;
      }
      #carga .barra {
        height: 8px;
        border-radius: 999px;
        background: #0b2a3080;
        border: 1px solid #f8efd25e;
        overflow: hidden;
      }
      #carga .barra i {
        display: block;
        height: 100%;
        width: 30%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f2c45a, #fff0ce);
        animation: vaiven 1.4s ease-in-out infinite alternate;
        transition: width 0.2s;
      }
      #carga.medida .barra i {
        animation: none;
      }
      #carga .estado {
        margin: 12px 0 0;
        min-height: 1.4em;
        font-size: 13px;
        opacity: 0.85;
      }
      @keyframes girar {
        to { transform: rotate(360deg); }
      }
      @keyframes vaiven {
        from { margin-left: 0; }
        to { margin-left: 70%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #carga .rosa, #carga .barra i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="carga" role="status" aria-live="polite">
      <div class="centro">
        <span class="rosa" aria-hidden="true">✥</span>
        <h1>CanaryQuest</h1>
        <p class="lema">Una aventura gráfica por las Islas Canarias</p>
        <div class="barra"><i></i></div>
        <p class="estado">Preparando el viaje…</p>
      </div>
    </div>
    <div id="game"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
