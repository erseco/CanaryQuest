<script type="module">
import {Group} from 'three';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {crearMaqueta} from '../src/puerto/maqueta';
import {cargarRecursos} from '../src/puerto/recursos';
import {crearInterior} from '../src/puerto/interior';
import {PUEBLOS} from '../src/data/pueblos';
window.exportar=async()=>{
const g=new Group(), {jugador}=crearMaqueta(g,await cargarRecursos('mogan'),'mogan');
jugador.name='Viajero'; g.name='Puerto';
const cuarto=crearInterior(); cuarto.decorar(PUEBLOS.mogan.casas[0]); cuarto.grupo.visible=true; cuarto.grupo.name='Casa';
const root=new Group();root.add(g,cuarto.grupo,jugador);
return await new Promise(async resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.readAsDataURL(new Blob([await new GLTFExporter().parseAsync(root,{binary:true})]));});
};
</script>
